name: CI

on:
  push:
    branches:
      - master
      - improvements/2.0
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        framework:
          - net8.0
          - net10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore AlgEff.sln

      - name: Build
        run: dotnet build AlgEff.sln --configuration Release --framework ${{ matrix.framework }} --no-restore

      - name: Test
        run: dotnet test AlgEff.Test/AlgEff.Test.fsproj --configuration Release --framework ${{ matrix.framework }} --no-build --logger "console;verbosity=minimal"

  pack:
    name: pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AlgEff.sln

      - name: Pack
        run: dotnet pack AlgEff/AlgEff.fsproj --configuration Release --no-restore --output artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
